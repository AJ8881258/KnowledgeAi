services:
  postgres:
    image: postgres:17
    container_name: knowflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowflow}
      POSTGRES_USER: ${POSTGRES_USER:-knowflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${KNOWFLOW_POSTGRES_PORT:-5432}:5432"
    volumes:
      - knowflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowflow} -d ${POSTGRES_DB:-knowflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: knowflow-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      KNOWFLOW_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-knowflow}
      KNOWFLOW_DB_USERNAME: ${POSTGRES_USER:-knowflow}
      KNOWFLOW_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      KNOWFLOW_DB_MAX_POOL_SIZE: ${KNOWFLOW_DB_MAX_POOL_SIZE:-10}
      KNOWFLOW_DB_MIN_IDLE: ${KNOWFLOW_DB_MIN_IDLE:-1}
      KNOWFLOW_JWT_SECRET: ${KNOWFLOW_JWT_SECRET:?Set KNOWFLOW_JWT_SECRET in .env}
      KNOWFLOW_MODEL_SECRET_KEY: ${KNOWFLOW_MODEL_SECRET_KEY:?Set KNOWFLOW_MODEL_SECRET_KEY in .env}
      KNOWFLOW_AI_BASE_URL: ${KNOWFLOW_AI_BASE_URL:-}
      KNOWFLOW_AI_API_KEY: ${KNOWFLOW_AI_API_KEY:-}
      KNOWFLOW_AI_MODEL: ${KNOWFLOW_AI_MODEL:-}
      KNOWFLOW_AI_TIMEOUT_SECONDS: ${KNOWFLOW_AI_TIMEOUT_SECONDS:-60}
    ports:
      - "${KNOWFLOW_BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: knowflow-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${KNOWFLOW_FRONTEND_PORT:-5173}:80"

volumes:
  knowflow-postgres-data:
