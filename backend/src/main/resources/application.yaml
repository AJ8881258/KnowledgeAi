spring:
  application:
    name: knowflow-backend
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  profiles:
    active: local
  docker:
    compose:
      # 本地直接运行时默认允许 Spring Boot 按 backend/compose.yaml 管理开发 PostgreSQL；
      # 容器化部署时由外层 Compose/平台管理依赖服务，应设置 SPRING_DOCKER_COMPOSE_ENABLED=false 避免后端容器再尝试控制 Docker。
      enabled: ${SPRING_DOCKER_COMPOSE_ENABLED:true}

  datasource:
    # 本地默认连接宿主机 localhost:5432/knowflow；Docker Compose 中后端容器应通过 KNOWFLOW_DB_URL 指向数据库服务名，例如 jdbc:postgresql://postgres:5432/knowflow。
    url: ${KNOWFLOW_DB_URL:jdbc:postgresql://localhost:5432/knowflow}
    # 本地开发账号沿用 backend/compose.yaml 的 knowflow/knowflow；容器或生产环境通过环境变量覆盖，避免把真实凭据写入仓库。
    username: ${KNOWFLOW_DB_USERNAME:knowflow}
    password: ${KNOWFLOW_DB_PASSWORD:knowflow}
    hikari:
      # 后端测试会创建多个 Spring 上下文，限制每个连接池大小，避免本地 PostgreSQL 出现 too many clients。
      # 生产环境可以通过 KNOWFLOW_DB_MAX_POOL_SIZE 覆盖为更高数值。
      maximum-pool-size: ${KNOWFLOW_DB_MAX_POOL_SIZE:5}
      minimum-idle: ${KNOWFLOW_DB_MIN_IDLE:1}

  flyway:
    # 开启 Flyway 数据库迁移
    enabled: true
    # 告诉 Flyway 去哪里找 SQL 脚本
    locations: classpath:db/migration

mybatis:
  configuration:
    # 数据库字段是 password_hash，Java 字段是 passwordHash，开启后可以自动映射
    map-underscore-to-camel-case: true

knowflow:
  jwt:
    # 本地开发用密钥。正式部署时不要把生产密钥直接提交到 Git。
    secret: ${KNOWFLOW_JWT_SECRET:}
    expires-in-minutes: 120
  ai:
    base-url: ${KNOWFLOW_AI_BASE_URL:}
    api-key: ${KNOWFLOW_AI_API_KEY:}
    model: ${KNOWFLOW_AI_MODEL:}
    embedding-model: ${KNOWFLOW_AI_EMBEDDING_MODEL:}
    timeout-seconds: ${KNOWFLOW_AI_TIMEOUT_SECONDS:60}
  model:
    # 用户模型 API Key 的加密密钥；正式部署时通过环境变量提供，不能写死生产密钥。
    secret-key: ${KNOWFLOW_MODEL_SECRET_KEY:}
  oss:
    # 用户头像存储在阿里云 OSS。bucket 可以和其他项目共用，但必须使用独立前缀隔离 KnowFlow 对象。
    endpoint: ${KNOWFLOW_OSS_ENDPOINT:}
    bucket: ${KNOWFLOW_OSS_BUCKET:}
    access-key-id: ${KNOWFLOW_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${KNOWFLOW_OSS_ACCESS_KEY_SECRET:}
    avatar-prefix: ${KNOWFLOW_OSS_AVATAR_PREFIX:knowflow/avatars}
    signed-url-ttl-seconds: ${KNOWFLOW_OSS_SIGNED_URL_TTL_SECONDS:3600}

server:
  port: 8080

---
spring:
  config:
    activate:
      on-profile: local

knowflow:
  model:
    # local profile 的开发默认密钥只用于本地学习和联调，生产环境通过 KNOWFLOW_MODEL_SECRET_KEY 覆盖或使用非 local profile。
    secret-key: ${KNOWFLOW_MODEL_SECRET_KEY:knowflow-local-development-model-secret-change-me}
