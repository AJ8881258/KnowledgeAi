spring:
  application:
    name: knowflow-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/knowflow
    username: knowflow
    password: knowflow

  flyway:
    # 开启 Flyway 数据库迁移
    enabled: true
    # 告诉 Flyway 去哪里找 SQL 脚本
    locations: classpath:db/migration

mybatis:
  configuration:
    # 数据库字段是 password_hash，Java 字段是 passwordHash，开启后可以自动映射
    map-underscore-to-camel-case: true

knowflow:
  jwt:
    # 本地开发用密钥。正式部署时不要把生产密钥直接提交到 Git。
    secret: "dev-only-knowflow-jwt-secret-must-be-at-least-32-characters"
    expires-in-minutes: 120

server:
  port: 8080
